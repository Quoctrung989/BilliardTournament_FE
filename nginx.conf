# ⚠️  KHÔNG DÙNG TRONG PRODUCTION — giữ làm phương án dự phòng.
#
# Từ 08/08/2026 frontend deploy trên Cloudflare Pages, không còn chạy container
# Nginx trên EC2. Service `frontend` đã xoá khỏi docker-compose.yml và job deploy
# đã gỡ khỏi workflow. Container này chưa từng được tạo trên server.
#
# Vai trò SPA fallback dưới đây giờ do `public/_redirects` đảm nhiệm:
#     /*    /index.html   200
#
# Chỉ dùng lại file này nếu cần dựng frontend trên EC2 khi Cloudflare có sự cố.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: mọi route không khớp file tĩnh đều trả về index.html cho React Router xử lý
    location / {
        try_files $uri /index.html;
    }

    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
