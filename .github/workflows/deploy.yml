name: CI/CD Frontend

on:
  push:
    branches: [prod]
  pull_request:
    branches: [prod]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          REACT_APP_API_URL: https://api.yourdomain.com

  deploy:
    needs: build-check
    if: github.ref == 'refs/heads/prod' && github.event_name == 'push'
    runs-on: [self-hosted, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build & restart frontend container
        run: |
          docker compose -f /opt/deploy/docker-compose.yml --env-file /opt/deploy/.env up -d --build frontend

      - name: Clean up dangling images
        run: docker image prune -f
